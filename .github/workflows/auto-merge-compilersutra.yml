name: Auto Merge (compilersutra)

# Approves + merges non-draft PRs opened by compilersutra.
# Prefer repo secret AUTO_MERGE_TOKEN = PAT for aabhinavg1 (or another admin who is
# NOT the PR author) with: contents + pull-requests write, and permission to bypass
# required checks. Falls back to GITHUB_TOKEN (needs repo setting
# "Allow GitHub Actions to create and approve pull requests").

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to force-merge
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Approve and merge compilersutra PRs
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN != '' && secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          FORCE_PR: ${{ github.event.inputs.pr_number || '' }}
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN != '' && secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const ALLOWED = new Set(['compilersutra']);
            const { owner, repo } = context.repo;
            const { execFileSync } = require('child_process');

            function gh(args) {
              return execFileSync('gh', args, {
                encoding: 'utf8',
                env: { ...process.env, GH_TOKEN: process.env.GH_TOKEN },
              }).trim();
            }

            async function sleep(ms) {
              await new Promise((r) => setTimeout(r, ms));
            }

            async function candidateNumbers() {
              if (process.env.FORCE_PR) {
                return [Number(process.env.FORCE_PR)];
              }

              if (context.payload.pull_request) {
                const pr = context.payload.pull_request;
                if (pr.draft) return [];
                if (!ALLOWED.has(pr.user.login)) return [];
                return [pr.number];
              }

              if (context.eventName === 'check_suite') {
                const sha = context.payload.check_suite.head_sha;
                const pulls = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                });
                return pulls
                  .filter((pr) => ALLOWED.has(pr.user.login) && !pr.draft && pr.head.sha === sha)
                  .map((pr) => pr.number);
              }

              return [];
            }

            async function approve(prNumber) {
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: prNumber,
                  event: 'APPROVE',
                  body: 'Auto-approved: compilersutra bot PR.',
                });
                console.log('Approved #' + prNumber);
              } catch (e) {
                console.log('Approve skipped for #' + prNumber + ':', e.message);
              }
            }

            async function waitMergeable(prNumber) {
              let pr;
              for (let i = 0; i < 8; i++) {
                pr = (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: prNumber,
                  })
                ).data;
                if (pr.merged) return pr;
                if (pr.mergeable !== null) return pr;
                await sleep(2000);
              }
              return pr;
            }

            async function mergePr(prNumber) {
              const pr = await waitMergeable(prNumber);
              if (!pr || pr.merged) {
                console.log('#' + prNumber + ' already merged or missing');
                return;
              }
              if (pr.user && !ALLOWED.has(pr.user.login)) {
                console.log('Skip #' + prNumber + ': author ' + pr.user.login);
                return;
              }
              if (pr.draft) {
                console.log('Skip #' + prNumber + ': draft');
                return;
              }
              if (pr.mergeable === false && pr.mergeable_state === 'dirty') {
                console.log('Skip #' + prNumber + ': merge conflicts');
                return;
              }

              await approve(prNumber);

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: 'merge',
                });
                console.log('Merged #' + prNumber + ' via API');
                return;
              } catch (e) {
                console.log('API merge failed for #' + prNumber + ':', e.message);
              }

              // Bypass required checks when token can (owner/admin PAT).
              try {
                const out = gh(['pr', 'merge', String(prNumber), '--merge', '--admin', '--repo', `${owner}/${repo}`]);
                console.log('Merged #' + prNumber + ' via gh --admin:', out);
              } catch (e) {
                console.log('Admin merge failed for #' + prNumber + ':', e.message);
                try {
                  const out = gh(['pr', 'merge', String(prNumber), '--merge', '--repo', `${owner}/${repo}`]);
                  console.log('Merged #' + prNumber + ' via gh:', out);
                } catch (e2) {
                  console.log('All merge attempts failed for #' + prNumber + ':', e2.message);
                }
              }
            }

            const numbers = await candidateNumbers();
            console.log('Candidates:', JSON.stringify(numbers), 'event=', context.eventName);
            for (const n of numbers) {
              await mergePr(n);
            }
