name: Auto Merge (compilersutra)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      (github.event.pull_request.user.login == 'compilersutra' || github.event.pull_request.user.login == 'aabhinavg1') &&
      github.event.pull_request.draft == false
    steps:
      - name: Approve and merge if mergeable
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE'
              });
              console.log('Approved PR #' + prNumber);
            } catch (e) {
              console.log('Approve skipped:', e.message);
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            if (pr.mergeable_state === 'dirty') {
              console.log('Has merge conflicts, skipping merge');
              return;
            }

            if (pr.mergeable_state === 'blocked') {
              console.log('Blocked by required checks');
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              console.log('Merged PR #' + prNumber);
            } catch (e) {
              console.log('Merge failed:', e.message);
            }
