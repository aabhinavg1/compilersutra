name: Auto Merge

# Immediate path for compilersutra PRs: request aabhinavg1, approve, merge.
# AUTO_MERGE_TOKEN must be an aabhinavg1 PAT.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'compilersutra' && !github.event.pull_request.draft
    steps:
      - name: Request aabhinavg1, approve, merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN != '' && secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          gh api -X POST "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=aabhinavg1" \
            && echo "Requested reviewer aabhinavg1" \
            || echo "request reviewers skipped"

          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            -b "Auto-approved by aabhinavg1 for compilersutra bot PR." \
            && echo "Approved" \
            || echo "Approve skipped (need AUTO_MERGE_TOKEN = aabhinavg1 PAT)"

          if gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --admin; then
            echo "Merged with --admin"
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --repo "$REPO" --merge; then
            echo "Merged without admin"
            exit 0
          fi
          echo "Merge not completed yet; auto-merge-compilersutra will retry on check_suite"
          exit 0
