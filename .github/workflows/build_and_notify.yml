name: Build and Notify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_and_notify:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # 0️⃣ Checkout
      # ---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log checkout info
        run: |
          echo "Repository checked out"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF"

      # ---------------------------------
      # 1️⃣ Detect docs changes
      # ---------------------------------
      - name: Detect docs changes
        id: detect_docs
        run: |
          HEAD="${{ github.sha }}"
          BASE="${{ github.event.before }}"

          # pull_request events have no `before`; the PR base is the correct diff point.
          if [ -z "$BASE" ] && [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi

          # Branch creation and absent `before` leave no usable base: fall back to the parent.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          if git diff --name-only "$BASE" "$HEAD" | grep -q '^docs/'; then
            echo "DOCS_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "DOCS_CHANGED=false" >> "$GITHUB_ENV"
          fi

          # Save commits to environment for Python script
          echo "BASE_COMMIT=$BASE" >> "$GITHUB_ENV"
          echo "HEAD_COMMIT=$HEAD" >> "$GITHUB_ENV"

      # ---------------------------------
      # 2️⃣ Enforce commit policy (prepare notification)
      # ---------------------------------
      - name: Enforce commit policy and prepare notification
        id: commit_policy
        env:
          DOCS_CHANGED: ${{ env.DOCS_CHANGED }}
          BASE_COMMIT: ${{ env.BASE_COMMIT }}
          HEAD_COMMIT: ${{ env.HEAD_COMMIT }}
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_LLVM_DISCUSSION: ${{ secrets.DISCORD_WEBHOOK_LLVM_DISCUSSION }}
        run: |
          python3 .ci/commit_policy.py

      # ---------------------------------
      # 3️⃣ Build project
      # ---------------------------------
      - name: Setup Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm ci

      - name: Build project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Starting build"
          npm run build
          echo "Build completed successfully"

      # ---------------------------------
      # 4️⃣ Notify Discord (only after successful build on main)
      # ---------------------------------
      - name: Send Discord notification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success() && steps.commit_policy.outputs.discord_message != ''
        env:
          DISCORD_MESSAGE: ${{ steps.commit_policy.outputs.discord_message }}
          DISCORD_WEBHOOK: ${{ steps.commit_policy.outputs.discord_webhook }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook configured, skipping notification"
            exit 0
          fi
          python3 -c 'import json, os, urllib.request; req = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], data=json.dumps({"content": os.environ["DISCORD_MESSAGE"]}).encode(), headers={"Content-Type": "application/json"}); resp = urllib.request.urlopen(req, timeout=15); status = getattr(resp, "status", 204); print(f"Discord notified (status={status})"); raise SystemExit(0 if status in (200, 204) else 1)'

      - name: Notify
        run: |
          echo "Documentation changed: $DOCS_CHANGED"
          echo "CI pipeline finished"
