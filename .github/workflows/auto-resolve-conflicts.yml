name: Auto Resolve Conflicts (compilersutra)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'compilersutra'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge base with theirs strategy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${BASE_REPO}.git" 2>/dev/null || true
          git fetch upstream "${BASE_REF}"

          if git merge-base --is-ancestor "upstream/${BASE_REF}" HEAD; then
            echo "Already up to date with upstream/${BASE_REF}"
            exit 0
          fi

          if git merge "upstream/${BASE_REF}" -X theirs --no-edit; then
            echo "Merged cleanly (theirs on conflicts)"
          else
            echo "Merge failed; refusing to commit conflict markers"
            git merge --abort || true
            gh pr comment "$PR_NUMBER" --body "Auto-resolve could not merge \`upstream/${BASE_REF}\` cleanly. Rebase or recreate the PR." || true
            exit 1
          fi

          if git grep -nE '^(<<<<<<<|>>>>>>>|=======)$' -- '*.md' '*.mdx' '*.js' '*.jsx' '*.ts' '*.tsx' '*.yml' '*.yaml' '*.json' >/tmp/conflict-markers.txt 2>/dev/null; then
            echo "Conflict markers still present after merge:"
            cat /tmp/conflict-markers.txt
            git reset --hard ORIG_HEAD || git reset --hard HEAD~1 || true
            gh pr comment "$PR_NUMBER" --body "Auto-resolve aborted: conflict markers would have been committed. Fix the PR manually." || true
            exit 1
          fi

          git push origin "HEAD:${HEAD_REF}"
