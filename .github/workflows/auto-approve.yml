name: Auto Approve

# For every non-draft PR from compilersutra:
# 1) request aabhinavg1 as reviewer
# 2) auto-approve as aabhinavg1 (via AUTO_MERGE_TOKEN PAT)
#
# Secret AUTO_MERGE_TOKEN must be a PAT for aabhinavg1 (not compilersutra).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'compilersutra' && !github.event.pull_request.draft
    steps:
      - name: Request aabhinavg1 + approve as aabhinavg1
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN != '' && secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const REVIEWER = 'aabhinavg1';

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: [REVIEWER],
              });
              console.log('Requested reviewer ' + REVIEWER + ' on #' + prNumber);
            } catch (e) {
              console.log('requestReviewers skipped:', e.message);
            }

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved by aabhinavg1 for compilersutra bot PR.',
              });
              console.log('Approved #' + prNumber + ' as token user (expect aabhinavg1)');
            } catch (e) {
              console.log(
                'Approve skipped (set AUTO_MERGE_TOKEN to an aabhinavg1 PAT):',
                e.message
              );
            }
