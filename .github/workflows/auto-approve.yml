name: Auto Approve

# Thin wrapper: real approve+merge lives in auto-merge-compilersutra.yml.
# Kept so older required-check names / bookmarks still succeed for compilersutra.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'compilersutra' && !github.event.pull_request.draft
    steps:
      - name: Approve compilersutra PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN != '' && secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: compilersutra bot PR.',
              });
              console.log('Approved #' + prNumber);
            } catch (e) {
              console.log('Approve skipped:', e.message);
              // Do not fail the job — merge workflow will retry with admin token.
            }
