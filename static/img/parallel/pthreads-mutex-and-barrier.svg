<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
    .mutex-box { fill: #1c2128; stroke: #d29922; stroke-width: 1.5; rx: 6px; }
    .barrier-box { fill: #1c2128; stroke: #58a6ff; stroke-width: 1.5; rx: 6px; }
    .text { font-family: monospace; font-size: 13px; fill: #c9d1d9; }
    .subtext { font-family: monospace; font-size: 11px; fill: #8b949e; }
    .line { stroke: #8b949e; stroke-width: 2; marker-end: url(#arrow); }
    .active-line { stroke: #3fb950; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Main Thread -->
  <rect x="20" y="110" width="100" height="40" class="box" />
  <text x="30" y="135" class="text">Main Thread</text>

  <!-- Create Fork -->
  <path d="M 120 130 L 170 60" class="line" />
  <path d="M 120 130 L 170 200" class="line" />

  <!-- Worker 0 -->
  <rect x="170" y="40" width="90" height="40" class="box" />
  <text x="185" y="65" class="text">Worker 0</text>

  <!-- Worker 1 -->
  <rect x="170" y="180" width="90" height="40" class="box" />
  <text x="185" y="205" class="text">Worker 1</text>

  <!-- Mutex Section -->
  <rect x="300" y="20" width="130" height="230" class="mutex-box" />
  <text x="310" y="40" class="text" fill="#d29922">pthread_mutex</text>
  <text x="310" y="60" class="subtext">Serialized Update</text>

  <path d="M 260 60 L 300 60" class="line" />
  <path d="M 260 200 L 300 200" class="line" />

  <!-- Barrier Section -->
  <rect x="470" y="20" width="110" height="230" class="barrier-box" />
  <text x="480" y="40" class="text" fill="#58a6ff">pthread_barrier</text>
  <text x="480" y="60" class="subtext">Phase Align</text>

  <path d="M 430 60 L 470 60" class="line" />
  <path d="M 430 200 L 470 200" class="line" />

  <!-- Join -->
  <path d="M 580 60 L 630 130" class="line" />
  <path d="M 580 200 L 630 130" class="line" />

  <!-- Final State -->
  <rect x="630" y="110" width="70" height="40" class="box" />
  <text x="645" y="135" class="text">Join</text>
</svg>
