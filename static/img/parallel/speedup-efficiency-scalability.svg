<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <style>
    .bg { fill: #1e1e1e; }
    .grid { stroke: #333333; stroke-width: 1; stroke-dasharray: 4,4; }
    .axis { stroke: #cccccc; stroke-width: 2; }
    .ideal { stroke: #4caf50; stroke-width: 2.5; stroke-dasharray: 6,6; }
    .actual { stroke: #00bcd4; stroke-width: 3; fill: none; }
    .amdahl { stroke: #ff9800; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
    .text { fill: #cccccc; font-family: monospace; font-size: 13px; }
    .label-ideal { fill: #4caf50; font-family: monospace; font-size: 12px; font-weight: bold; }
    .label-actual { fill: #00bcd4; font-family: monospace; font-size: 12px; font-weight: bold; }
    .label-amdahl { fill: #ff9800; font-family: monospace; font-size: 12px; font-weight: bold; }
    .highlight { fill: #f44336; font-size: 11px; font-family: monospace; }
  </style>
  <rect width="650" height="360" class="bg" />
  
  <!-- Grid lines -->
  <line x1="80" y1="280" x2="580" y2="280" class="grid" />
  <line x1="80" y1="220" x2="580" y2="220" class="grid" />
  <line x1="80" y1="160" x2="580" y2="160" class="grid" />
  <line x1="80" y1="100" x2="580" y2="100" class="grid" />
  <line x1="80" y1="40" x2="580" y2="40" class="grid" />

  <line x1="180" y1="40" x2="180" y2="300" class="grid" />
  <line x1="280" y1="40" x2="280" y2="300" class="grid" />
  <line x1="380" y1="40" x2="380" y2="300" class="grid" />
  <line x1="480" y1="40" x2="480" y2="300" class="grid" />
  <line x1="580" y1="40" x2="580" y2="300" class="grid" />

  <!-- Axes -->
  <line x1="80" y1="300" x2="600" y2="300" class="axis" />
  <line x1="80" y1="300" x2="80" y2="30" class="axis" />

  <!-- Axis Labels -->
  <text x="310" y="340" class="text">Number of Workers (p)</text>
  <text x="20" y="170" class="text" transform="rotate(-90, 25, 170)">Speedup (Sp)</text>

  <!-- Ticks -->
  <text x="75" y="318" class="text">1</text>
  <text x="175" y="318" class="text">4</text>
  <text x="275" y="318" class="text">8</text>
  <text x="375" y="318" class="text">12</text>
  <text x="475" y="318" class="text">16</text>
  <text x="575" y="318" class="text">20</text>

  <text x="60" y="305" class="text">1x</text>
  <text x="60" y="225" class="text">5x</text>
  <text x="55" y="165" class="text">10x</text>
  <text x="55" y="105" class="text">15x</text>
  <text x="55" y="45" class="text">20x</text>

  <!-- Curves -->
  <!-- Ideal Linear Speedup: (80,300) to (580,40) -->
  <line x1="80" y1="300" x2="580" y2="40" class="ideal" />
  <text x="470" y="70" class="label-ideal">Linear Ideal (Sp = p)</text>

  <!-- Measured Speedup Curve -->
  <path d="M 80 300 Q 280 180, 580 145" class="actual" />
  <text x="440" y="135" class="label-actual">Measured Speedup</text>

  <!-- Theoretical Amdahl Limit (e.g., 5% serial fraction -> max 20x, but flattens earlier) -->
  <path d="M 80 300 Q 280 160, 580 110" class="amdahl" />
  <text x="430" y="100" class="label-amdahl">Amdahl Limit (f = 0.05)</text>

  <!-- Annotations -->
  <line x1="580" y1="145" x2="580" y2="40" stroke="#f44336" stroke-width="1.5" stroke-dasharray="2,2" />
  <text x="440" y="190" class="highlight">Loss due to Communication,</text>
  <text x="440" y="205" class="highlight">Sync, &amp; Serial Fraction (f)</text>
</svg>
