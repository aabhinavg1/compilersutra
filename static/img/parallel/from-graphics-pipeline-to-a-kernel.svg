<svg viewBox="0 0 850 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1e1e2e; }
    .box { fill: #2b2b3d; stroke: #4b4b66; stroke-width: 2; }
    .highlight-box { fill: #1b3b2b; stroke: #2e8b57; stroke-width: 2; }
    .text { fill: #cdd6f4; font-family: monospace; font-size: 13px; text-anchor: middle; }
    .subtext { fill: #a6adc8; font-family: monospace; font-size: 11px; text-anchor: middle; }
    .title { fill: #89b4fa; font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .arrow { stroke: #89b4fa; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa" />
    </marker>
  </defs>

  <rect class="bg" width="850" height="200" rx="8" />

  <!-- Stage 1 -->
  <rect class="box" x="20" y="70" width="170" height="70" rx="6" />
  <text class="title" x="105" y="95">1. Fixed Pipeline</text>
  <text class="subtext" x="105" y="120">Hardwired functions</text>

  <line class="arrow" x1="190" y1="105" x2="220" y1="105" />

  <!-- Stage 2 -->
  <rect class="box" x="220" y="70" width="180" height="70" rx="6" />
  <text class="title" x="310" y="95">2. Shader Stages</text>
  <text class="subtext" x="310" y="120">Vert / Frag programs</text>

  <line class="arrow" x1="400" y1="105" x2="430" y1="105" />

  <!-- Stage 3 -->
  <rect class="box" x="430" y="70" width="190" height="70" rx="6" />
  <text class="title" x="525" y="95">3. Unified Cores</text>
  <text class="subtext" x="525" y="120">Shared ALU resource</text>

  <line class="arrow" x1="620" y1="105" x2="650" y1="105" />

  <!-- Stage 4 -->
  <rect class="highlight-box" x="650" y="70" width="180" height="70" rx="6" />
  <text class="title" x="740" y="95" fill="#a6e3a1">4. Kernel Dispatch</text>
  <text class="subtext" x="740" y="120" fill="#a6e3a1">Linear memory write</text>
</svg>
