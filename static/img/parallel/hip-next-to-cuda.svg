<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%">
  <rect width="720" height="280" fill="#0f172a" rx="8" />
  
  <!-- Single Source Box -->
  <rect x="250" y="20" width="220" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6" />
  <text x="360" y="50" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HIP Kernel Source (.hip)</text>
  
  <!-- Compiler Driver Split -->
  <path d="M 360 70 L 200 120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 360 70 L 520 120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- AMD Target Path -->
  <rect x="100" y="120" width="200" height="60" fill="#1e293b" stroke="#f43f5e" stroke-width="2" rx="6" />
  <text x="200" y="145" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">hipcc (AMD Platform)</text>
  <text x="200" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">ROCm / LLVM AMDGPU Target</text>
  
  <!-- NVIDIA Target Path -->
  <rect x="420" y="120" width="200" height="60" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="6" />
  <text x="520" y="145" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">hipcc (NVIDIA Platform)</text>
  <text x="520" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">NVCC Header / Header Translation</text>
  
  <!-- Lowering Arrows -->
  <path d="M 200 180 L 200 220" stroke="#94a3b8" stroke-width="2" />
  <path d="M 520 180 L 520 220" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Output Binaries -->
  <rect x="100" y="220" width="200" height="45" fill="#0284c7" rx="4" />
  <text x="200" y="247" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AMDGPU ISA Binaries</text>
  
  <rect x="420" y="220" width="200" height="45" fill="#047857" rx="4" />
  <text x="520" y="247" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NVIDIA PTX / SASS</text>
</svg>
