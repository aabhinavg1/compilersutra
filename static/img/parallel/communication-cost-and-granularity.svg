<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="100%" height="100%">
  <rect width="720" height="310" fill="#0f172a" rx="8"/>
  
  <text x="360" y="28" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">Effect of Increasing Worker Count on Execution Granularity</text>
  
  <!-- 2 Workers -->
  <g transform="translate(30, 50)">
    <text x="0" y="22" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">2 Workers</text>

    <!-- Worker 0 -->
    <rect x="100" y="5" width="40" height="25" fill="#ef4444" rx="3"/>
    <text x="120" y="22" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">ts</text>
    <rect x="142" y="5" width="200" height="25" fill="#3b82f6" rx="3"/>
    <text x="242" y="22" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">Compute (N/2)</text>
    <rect x="344" y="5" width="40" height="25" fill="#ef4444" rx="3"/>
    <text x="364" y="22" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">ts</text>

    <!-- Worker 1 -->
    <rect x="100" y="35" width="40" height="25" fill="#ef4444" rx="3"/>
    <text x="120" y="52" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">ts</text>
    <rect x="142" y="35" width="200" height="25" fill="#3b82f6" rx="3"/>
    <text x="242" y="52" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">Compute (N/2)</text>
    <rect x="344" y="35" width="40" height="25" fill="#ef4444" rx="3"/>
    <text x="364" y="52" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">ts</text>
  </g>

  <!-- 8 Workers -->
  <g transform="translate(30, 150)">
    <text x="0" y="42" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">8 Workers</text>

    <!-- Worker 0 -->
    <rect x="100" y="5" width="40" height="20" fill="#ef4444" rx="3"/>
    <rect x="142" y="5" width="50" height="20" fill="#3b82f6" rx="3"/>
    <text x="167" y="19" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">N/8</text>
    <rect x="194" y="5" width="40" height="20" fill="#ef4444" rx="3"/>

    <!-- Worker 1..7 represented visually -->
    <rect x="100" y="28" width="40" height="20" fill="#ef4444" rx="3"/>
    <rect x="142" y="28" width="50" height="20" fill="#3b82f6" rx="3"/>
    <rect x="194" y="28" width="40" height="20" fill="#ef4444" rx="3"/>

    <rect x="100" y="51" width="40" height="20" fill="#ef4444" rx="3"/>
    <rect x="142" y="51" width="50" height="20" fill="#3b82f6" rx="3"/>
    <rect x="194" y="51" width="40" height="20" fill="#ef4444" rx="3"/>

    <rect x="100" y="74" width="40" height="20" fill="#ef4444" rx="3"/>
    <rect x="142" y="74" width="50" height="20" fill="#3b82f6" rx="3"/>
    <rect x="194" y="74" width="40" height="20" fill="#ef4444" rx="3"/>
  </g>

  <!-- Legend -->
  <g transform="translate(480, 180)">
    <rect x="0" y="0" width="210" height="95" fill="#1e293b" stroke="#334155" rx="5"/>
    <rect x="15" y="15" width="20" height="15" fill="#3b82f6" rx="2"/>
    <text x="45" y="27" fill="#cbd5e1" font-family="monospace" font-size="11">Computation Time</text>
    <rect x="15" y="40" width="20" height="15" fill="#ef4444" rx="2"/>
    <text x="45" y="52" fill="#cbd5e1" font-family="monospace" font-size="11">Message / Setup Overhead (ts)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="10">ts remains constant per task</text>
  </g>

  <!-- Explanation note -->
  <text x="360" y="292" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">As problem size per worker drops, fixed latency (ts) dominates execution.</text>
</svg>
