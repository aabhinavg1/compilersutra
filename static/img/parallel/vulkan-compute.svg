<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background panel -->
  <rect x="0" y="0" width="720" height="220" rx="8" fill="#1e293b" />
  
  <!-- Stage 1: High Level Source -->
  <rect x="20" y="40" width="130" height="140" rx="6" fill="#334155" stroke="#64748b" stroke-width="2" />
  <text x="85" y="65" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Source Code</text>
  <text x="85" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">GLSL / HLSL</text>
  <text x="85" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Compute Kernel</text>
  <text x="85" y="150" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">High-Level Syntax</text>

  <!-- Arrow 1 -->
  <path d="M 150 110 L 180 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="165" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">glslang / dxc</text>

  <!-- Stage 2: SPIR-V Module -->
  <rect x="195" y="40" width="130" height="140" rx="6" fill="#334155" stroke="#0284c7" stroke-width="2" />
  <text x="260" y="65" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SPIR-V IR</text>
  <text x="260" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Binary Bytecode</text>
  <text x="260" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SSA Representation</text>
  <text x="260" y="150" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">32-bit Word Stream</text>

  <!-- Arrow 2 -->
  <path d="M 325 110 L 355 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 3: Pipeline Object -->
  <rect x="370" y="40" width="150" height="140" rx="6" fill="#334155" stroke="#10b981" stroke-width="2" />
  <text x="445" y="65" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Vulkan Pipeline</text>
  <text x="445" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">SPIR-V Module</text>
  <text x="445" y="108" fill="#f59e0b" font-family="sans-serif" font-size="11" text-anchor="middle">+ VkPipelineLayout</text>
  <text x="445" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">(Push Constants &amp;</text>
  <text x="445" y="145" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Descriptor Sets)</text>

  <!-- Arrow 3 -->
  <path d="M 520 110 L 550 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="535" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Driver JIT</text>

  <!-- Stage 4: GPU Machine Code -->
  <rect x="565" y="40" width="135" height="140" rx="6" fill="#334155" stroke="#8b5cf6" stroke-width="2" />
  <text x="632" y="65" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Hardware ISA</text>
  <text x="632" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Native Machine</text>
  <text x="632" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Instructions</text>
  <text x="632" y="150" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Target GPU Execution</text>

  <!-- Marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
