<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="100%">
  <!-- Background -->
  <rect x="0" y="0" width="720" height="340" fill="#0f172a" rx="8" />

  <!-- Title -->
  <text x="360" y="28" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">Cache Line Ping-Ponging (False Sharing)</text>

  <!-- Core 0 Domain -->
  <rect x="30" y="55" width="220" height="250" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6" />
  <text x="140" y="80" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Core 0</text>
  <rect x="45" y="100" width="190" height="40" fill="#0284c7" rx="4" />
  <text x="140" y="125" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">Writes: counts[0]</text>
  
  <rect x="45" y="160" width="190" height="80" fill="#0f172a" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="140" y="180" fill="#f1f5f9" font-family="sans-serif" font-size="11" text-anchor="middle">L1 Cache Line Status:</text>
  <text x="140" y="205" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">INVALID</text>
  <text x="140" y="225" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">(Evicted by Core 1 write)</text>

  <!-- Core 1 Domain -->
  <rect x="470" y="55" width="220" height="250" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6" />
  <text x="580" y="80" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Core 1</text>
  <rect x="485" y="100" width="190" height="40" fill="#0284c7" rx="4" />
  <text x="580" y="125" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">Writes: counts[1]</text>
  
  <rect x="485" y="160" width="190" height="80" fill="#0f172a" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="580" y="180" fill="#f1f5f9" font-family="sans-serif" font-size="11" text-anchor="middle">L1 Cache Line Status:</text>
  <text x="580" y="205" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">MODIFIED (EXCLUSIVE)</text>
  <text x="580" y="225" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">(Holds ownership of line)</text>

  <!-- Interconnect / Shared Cache Line -->
  <rect x="270" y="130" width="180" height="130" fill="#334155" stroke="#f59e0b" stroke-width="2" rx="6" />
  <text x="360" y="152" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Shared 64-Byte Line</text>
  <line x1="280" y1="165" x2="440" y2="165" stroke="#475569" stroke-width="1" />
  
  <rect x="280" y="175" width="75" height="35" fill="#0284c7" rx="2" />
  <text x="317" y="197" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">counts[0]</text>
  
  <rect x="365" y="175" width="75" height="35" fill="#0284c7" rx="2" />
  <text x="402" y="197" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">counts[1]</text>

  <text x="360" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Same Cache Line Address</text>
  <text x="360" y="248" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">0x7fff5fbff040</text>

  <!-- Ping Pong Arrows -->
  <path d="M 235 140 L 270 140" stroke="#ef4444" stroke-width="2" marker-end="url(#red-arrow)" />
  <path d="M 270 210 L 235 210" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" />
  
  <path d="M 485 140 L 450 140" stroke="#22c55e" stroke-width="2" />
  <path d="M 450 210 L 485 210" stroke="#ef4444" stroke-width="2" />

  <text x="360" y="295" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Continuous Invalidation Requests across Interconnect Bus</text>

  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
</svg>
