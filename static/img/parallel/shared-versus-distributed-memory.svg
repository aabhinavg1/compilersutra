<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .box-shared { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8px; }
    .box-dist { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8px; }
    .node-box { fill: #21262d; stroke: #484f58; stroke-width: 1.5; rx: 6px; }
    .core-box { fill: #2d333b; stroke: #58a6ff; stroke-width: 1.5; rx: 4px; }
    .cache-box { fill: #1c2128; stroke: #388bfd; stroke-width: 1; rx: 3px; }
    .mem-box { fill: #1f6feb; stroke: #58a6ff; stroke-width: 1.5; rx: 4px; }
    .dist-mem { fill: #238636; stroke: #3fb950; stroke-width: 1.5; rx: 4px; }
    .text-title { fill: #f0f6fc; font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 15px; }
    .text-sub { fill: #8b949e; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
    .text-body { fill: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .text-white { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; }
    .bus-line { stroke: #58a6ff; stroke-width: 2.5; stroke-dasharray: none; }
    .net-line { stroke: #3fb950; stroke-width: 2.5; stroke-dasharray: 4,4; }
    .label-header { fill: #58a6ff; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 16px; }
    .label-green { fill: #3fb950; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 16px; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- LEFT: SHARED MEMORY -->
  <rect x="20" y="20" width="400" height="400" class="box-shared" />
  <text x="40" y="50" class="label-header">Shared Memory Architecture</text>
  <text x="40" y="70" class="text-sub">Unified Address Space (Single OS / Process Space)</text>

  <!-- Core 0 -->
  <rect x="40" y="95" width="160" height="90" class="node-box" />
  <text x="50" y="115" class="text-title">Core 0</text>
  <rect x="50" y="125" width="140" height="25" class="core-box" />
  <text x="60" y="142" class="text-body">Execution Registers</text>
  <rect x="50" y="155" width="140" height="20" class="cache-box" />
  <text x="80" y="169" class="text-sub">L1/L2 Cache</text>

  <!-- Core 1 -->
  <rect x="240" y="95" width="160" height="90" class="node-box" />
  <text x="250" y="115" class="text-title">Core 1</text>
  <rect x="250" y="125" width="140" height="25" class="core-box" />
  <text x="260" y="142" class="text-body">Execution Registers</text>
  <rect x="250" y="155" width="140" height="20" class="cache-box" />
  <text x="280" y="169" class="text-sub">L1/L2 Cache</text>

  <!-- System Bus / Coherence Interconnect -->
  <line x1="120" y1="185" x2="120" y2="230" class="bus-line" />
  <line x1="320" y1="185" x2="320" y2="230" class="bus-line" />
  <line x1="80" y1="230" x2="360" y2="230" class="bus-line" />
  <text x="135" y="222" class="text-sub">Hardware Coherence Bus</text>

  <!-- Shared Memory Box -->
  <line x1="220" y1="230" x2="220" y2="270" class="bus-line" />
  <rect x="60" y="270" width="320" height="120" class="mem-box" />
  <text x="80" y="300" class="text-white">Unified System RAM (Global Memory)</text>
  <text x="80" y="325" class="text-body">• Virtual Address: 0x7FFF0000 accessible by both cores</text>
  <text x="80" y="345" class="text-body">• Read/Write via hardware load/store instructions</text>
  <text x="80" y="365" class="text-body">• Synchronized via hardware cache coherence</text>

  <!-- RIGHT: DISTRIBUTED MEMORY -->
  <rect x="460" y="20" width="400" height="400" class="box-dist" />
  <text x="480" y="50" class="label-green">Distributed Memory Architecture</text>
  <text x="480" y="70" class="text-sub">Disjoint Address Spaces (Isolated Processes)</text>

  <!-- Node 0 -->
  <rect x="480" y="95" width="170" height="200" class="node-box" />
  <text x="495" y="120" class="text-title">Node 0 (Rank 0)</text>
  <rect x="495" y="130" width="140" height="30" class="core-box" />
  <text x="505" y="150" class="text-body">CPU / Core Stack</text>
  <rect x="495" y="170" width="140" height="45" class="dist-mem" />
  <text x="505" y="190" class="text-white">Local RAM (Rank 0)</text>
  <text x="505" y="205" class="text-sub">Address: 0x7FFF... (Local)</text>
  <rect x="495" y="225" width="140" height="50" class="cache-box" />
  <text x="505" y="245" class="text-body">Network Interface</text>
  <text x="505" y="260" class="text-sub">(NIC / RDMA Adapter)</text>

  <!-- Node 1 -->
  <rect x="670" y="95" width="170" height="200" class="node-box" />
  <text x="685" y="120" class="text-title">Node 1 (Rank 1)</text>
  <rect x="685" y="130" width="140" height="30" class="core-box" />
  <text x="695" y="150" class="text-body">CPU / Core Stack</text>
  <rect x="685" y="170" width="140" height="45" class="dist-mem" />
  <text x="695" y="190" class="text-white">Local RAM (Rank 1)</text>
  <text x="695" y="205" class="text-sub">Address: 0x7FFF... (Local)</text>
  <rect x="685" y="225" width="140" height="50" class="cache-box" />
  <text x="695" y="245" class="text-body">Network Interface</text>
  <text x="695" y="260" class="text-sub">(NIC / RDMA Adapter)</text>

  <!-- Network Interconnect -->
  <line x1="565" y1="275" x2="565" y2="330" class="net-line" />
  <line x1="755" y1="275" x2="755" y2="330" class="net-line" />
  <line x1="520" y1="330" x2="800" y2="330" class="net-line" />
  <rect x="540" y="350" width="240" height="50" class="node-box" />
  <text x="555" y="370" class="text-title" fill="#3fb950">High-Speed Interconnect</text>
  <text x="555" y="388" class="text-sub">Explicit Packets / RDMA / Message Passing</text>
</svg>
