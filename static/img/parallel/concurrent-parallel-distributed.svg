<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="360" fill="#f8f9fa" rx="8" />

  <!-- CONCURRENT MODEL -->
  <g transform="translate(20, 30)">
    <rect width="230" height="300" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="6" />
    <text x="115" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Concurrent (Time-Sliced)</text>
    
    <!-- Single Core Box -->
    <rect x="25" y="50" width="180" height="220" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="4" />
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">Single Physical Core</text>
    
    <!-- Thread 1 -->
    <rect x="40" y="90" width="150" height="40" fill="#cfe2ff" stroke="#9ec5fe" stroke-width="1" rx="4" />
    <text x="115" y="115" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#084298">Thread A (Active)</text>
    
    <!-- Context Switch Indicator -->
    <path d="M 115 135 L 115 175" stroke="#6c757d" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    
    <!-- Thread 2 -->
    <rect x="40" y="180" width="150" height="40" fill="#f8d7da" stroke="#f5c2c7" stroke-width="1" rx="4" />
    <text x="115" y="205" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#842029">Thread B (Suspended)</text>
    
    <text x="115" y="255" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">Shared Virtual Memory</text>
  </g>

  <!-- PARALLEL MODEL -->
  <g transform="translate(285, 30)">
    <rect width="230" height="300" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="6" />
    <text x="115" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Parallel (Multi-Core)</text>
    
    <!-- Core 0 -->
    <rect x="15" y="50" width="95" height="150" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="4" />
    <text x="62" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">Core 0</text>
    <rect x="22" y="90" width="80" height="90" fill="#cfe2ff" stroke="#9ec5fe" stroke-width="1" rx="4" />
    <text x="62" y="140" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#084298">Thread A</text>

    <!-- Core 1 -->
    <rect x="120" y="50" width="95" height="150" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="4" />
    <text x="167" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">Core 1</text>
    <rect x="127" y="90" width="80" height="90" fill="#f8d7da" stroke="#f5c2c7" stroke-width="1" rx="4" />
    <text x="167" y="140" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#842029">Thread B</text>

    <!-- Shared Memory Bus -->
    <rect x="15" y="215" width="200" height="45" fill="#e2e3e5" stroke="#cbccce" stroke-width="1" rx="4" />
    <text x="115" y="235" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#383d41">Shared L3 Cache / DRAM</text>
    <text x="115" y="250" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#383d41">Hardware Coherence</text>
    
    <path d="M 62 200 L 62 215" stroke="#495057" stroke-width="1.5" />
    <path d="M 167 200 L 167 215" stroke="#495057" stroke-width="1.5" />
  </g>

  <!-- DISTRIBUTED MODEL -->
  <g transform="translate(550, 30)">
    <rect width="230" height="300" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="6" />
    <text x="115" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Distributed (Multi-Node)</text>
    
    <!-- Node A -->
    <rect x="15" y="50" width="95" height="150" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="4" />
    <text x="62" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">Node A</text>
    <rect x="22" y="90" width="80" height="40" fill="#cfe2ff" stroke="#9ec5fe" stroke-width="1" rx="4" />
    <text x="62" y="115" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#084298">Thread A</text>
    <rect x="22" y="140" width="80" height="50" fill="#fff3cd" stroke="#ffe69c" stroke-width="1" rx="4" />
    <text x="62" y="165" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#664d03">Memory A</text>

    <!-- Node B -->
    <rect x="120" y="50" width="95" height="150" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" rx="4" />
    <text x="167" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">Node B</text>
    <rect x="127" y="90" width="80" height="40" fill="#f8d7da" stroke="#f5c2c7" stroke-width="1" rx="4" />
    <text x="167" y="115" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#842029">Thread B</text>
    <rect x="127" y="140" width="80" height="50" fill="#d1e7dd" stroke="#badbcc" stroke-width="1" rx="4" />
    <text x="167" y="165" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#0f5132">Memory B</text>

    <!-- Network Link -->
    <path d="M 62 200 L 62 230 L 167 230 L 167 200" fill="none" stroke="#0d6efd" stroke-width="2" stroke-dasharray="2,2" />
    <rect x="55" y="220" width="120" height="20" fill="#0d6efd" rx="3" />
    <text x="115" y="234" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">Network Message</text>
    
    <text x="115" y="275" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">Disjoint Address Spaces</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
    </marker>
  </defs>
</svg>
