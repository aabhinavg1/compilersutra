<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="100%" height="100%">
  <rect width="720" height="310" fill="#0f172a" rx="8" />
  
  <!-- Host Boundary -->
  <rect x="20" y="20" width="680" height="270" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4" rx="6" />
  <text x="35" y="42" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="bold">HOST RUNTIME BOUNDARY</text>

  <!-- Platform -->
  <rect x="40" y="60" width="200" height="210" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" />
  <text x="55" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">cl_platform_id</text>
  <text x="55" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">Vendor Driver (e.g. NVIDIA/AMD)</text>
  
  <rect x="55" y="125" width="170" height="130" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" rx="4" />
  <text x="65" y="150" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold">cl_device_id</text>
  <text x="65" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11">Target GPU or CPU Core</text>

  <!-- Context -->
  <rect x="260" y="60" width="420" height="210" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="6" />
  <text x="275" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">cl_context</text>
  <text x="275" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">Virtual Memory Space &amp; Object Container</text>

  <!-- Queue & Kernel -->
  <rect x="275" y="125" width="185" height="130" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="4" />
  <text x="285" y="150" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">cl_command_queue</text>
  <text x="285" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11">In-order / Out-of-order</text>
  <text x="285" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Command Stream</text>

  <rect x="480" y="125" width="185" height="130" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="4" />
  <text x="490" y="150" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">cl_kernel &amp; Launch</text>
  <text x="490" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11">NDRange: Global (Grid)</text>
  <text x="490" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Work-Group (Block)</text>
  <text x="490" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">Work-Item (Thread)</text>

  <!-- Arrows -->
  <path d="M 225 190 L 275 190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 460 190 L 480 190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
</svg>
