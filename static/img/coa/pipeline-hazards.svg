<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="300" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Pipeline Hazard Resolution: Forwarding vs Stalling
  </text>

  <!-- CASE 1: Forwarding Path -->
  <g transform="translate(25, 50)">
    <text x="260" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">
      Case A: ALU to ALU Forwarding (No Stall)
    </text>

    <!-- Cycle headers -->
    <text x="110" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC1</text>
    <text x="180" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC2</text>
    <text x="250" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC3</text>
    <text x="320" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC4</text>
    <text x="390" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC5</text>

    <!-- Inst 1 -->
    <text x="10" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">ADD R1, R2</text>
    <rect x="90" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="110" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">IF</text>
    <rect x="160" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="180" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">ID</text>
    <rect x="230" y="52" width="40" height="20" fill="#0284c7" stroke="#0369a1" rx="3"/><text x="250" y="66" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">EX</text>
    <rect x="300" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="320" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">MEM</text>
    <rect x="370" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="390" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">WB</text>

    <!-- Inst 2 -->
    <text x="10" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">SUB R3, R1</text>
    <rect x="160" y="82" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="180" y="96" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">IF</text>
    <rect x="230" y="82" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="250" y="96" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">ID</text>
    <rect x="300" y="82" width="40" height="20" fill="#0284c7" stroke="#0369a1" rx="3"/><text x="320" y="96" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">EX</text>
    <rect x="370" y="82" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="390" y="96" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">MEM</text>

    <!-- Forwarding Arrow -->
    <path d="M 270 62 C 285 62, 285 92, 298 92" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="288" y="115" font-family="sans-serif" font-size="10" fill="#0284c7" font-weight="bold" text-anchor="middle">Hardware Bypass Network</text>
  </g>

  <!-- CASE 2: Load-Use Hazard Stall -->
  <g transform="translate(25, 185)">
    <text x="260" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">
      Case B: Load-Use Hazard (1-Cycle Mandatory Stall Bubble)
    </text>

    <!-- Cycle headers -->
    <text x="110" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC1</text>
    <text x="180" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC2</text>
    <text x="250" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC3</text>
    <text x="320" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC4</text>
    <text x="390" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC5</text>
    <text x="460" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CC6</text>

    <!-- Inst 1 -->
    <text x="10" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">LOAD R1, [R2]</text>
    <rect x="90" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="110" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">IF</text>
    <rect x="160" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="180" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">ID</text>
    <rect x="230" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="250" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">EX</text>
    <rect x="300" y="52" width="40" height="20" fill="#0284c7" stroke="#0369a1" rx="3"/><text x="320" y="66" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">MEM</text>
    <rect x="370" y="52" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="390" y="66" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">WB</text>

    <!-- Inst 2 -->
    <text x="10" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">ADD R4, R1</text>
    <rect x="160" y="82" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="180" y="96" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">IF</text>
    <rect x="230" y="82" width="40" height="20" fill="#fef08a" stroke="#ca8a04" rx="3"/><text x="250" y="96" font-family="sans-serif" font-size="10" fill="#854d0e" font-weight="bold" text-anchor="middle">ID</text>
    <rect x="300" y="82" width="40" height="20" fill="#fca5a5" stroke="#dc2626" rx="3"/><text x="320" y="96" font-family="sans-serif" font-size="10" fill="#991b1b" font-weight="bold" text-anchor="middle">STALL</text>
    <rect x="370" y="82" width="40" height="20" fill="#0284c7" stroke="#0369a1" rx="3"/><text x="390" y="96" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">EX</text>
    <rect x="440" y="82" width="40" height="20" fill="#e2e8f0" stroke="#475569" rx="3"/><text x="460" y="96" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">MEM</text>

    <!-- Forwarding Arrow Load to EX -->
    <path d="M 340 62 C 355 62, 355 92, 368 92" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)"/>
    <text x="360" y="115" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold" text-anchor="middle">Data Available After MEM</text>
  </g>
</svg>
