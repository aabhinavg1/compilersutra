<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    Pipeline Flush Mechanics on Misprediction
  </text>

  <!-- Speculative Path Container -->
  <rect x="30" y="60" width="540" height="110" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" />
  <text x="45" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">
    1. Speculative Execution Path (Incorrect Guess)
  </text>

  <!-- Pipeline Stages -->
  <rect x="45" y="95" width="85" height="35" fill="#0284c7" rx="4" />
  <text x="87" y="117" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Fetch / Decode</text>

  <rect x="145" y="95" width="85" height="35" fill="#0284c7" rx="4" />
  <text x="187" y="117" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Rename / Dispatch</text>

  <rect x="245" y="95" width="85" height="35" fill="#0284c7" rx="4" />
  <text x="287" y="117" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Execute Branch</text>

  <!-- Squelched Micro-ops -->
  <rect x="345" y="95" width="100" height="35" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" rx="4" />
  <text x="395" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">Speculative Op 1</text>
  <text x="395" y="124" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#dc2626">(Squelched)</text>

  <rect x="455" y="95" width="100" height="35" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" rx="4" />
  <text x="505" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">Speculative Op 2</text>
  <text x="505" y="124" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic" fill="#dc2626">(Squelched)</text>

  <!-- Arrows between speculative stages -->
  <line x1="130" y1="112" x2="145" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="230" y1="112" x2="245" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="330" y1="112" x2="345" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="445" y1="112" x2="455" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Detection Callout -->
  <text x="287" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">
    Misprediction Detected Here
  </text>

  <!-- Redirection Line -->
  <path d="M 287 130 L 287 200 L 87 200 L 87 215" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-red)" />
  <text x="187" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">
    Pipeline Flush &amp; Fetch Redirection
  </text>

  <!-- Correct Path Container -->
  <rect x="30" y="220" width="540" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" />
  <text x="45" y="240" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">
    2. Correct Execution Path (Pipeline Refill)
  </text>

  <!-- Correct Pipeline Stages -->
  <rect x="45" y="255" width="110" height="35" fill="#0284c7" rx="4" />
  <text x="100" y="277" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Refill Fetch</text>

  <rect x="175" y="255" width="110" height="35" fill="#0284c7" rx="4" />
  <text x="230" y="277" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Decode / Rename</text>

  <rect x="305" y="255" width="110" height="35" fill="#0284c7" rx="4" />
  <text x="360" y="277" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Execute Correct Path</text>

  <rect x="435" y="255" width="110" height="35" fill="#16a34a" rx="4" />
  <text x="490" y="277" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">Retire</text>

  <!-- Arrows between correct stages -->
  <line x1="155" y1="272" x2="175" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="285" y1="272" x2="305" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="415" y1="272" x2="435" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
</svg>
