<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Compiler Domain Box -->
  <rect x="20" y="20" width="260" height="310" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="150" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Compiler Optimizations (Software)</text>

  <!-- Compiler Internal Steps -->
  <rect x="40" y="70" width="220" height="40" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="150" y="94" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Loop Unrolling &amp; ILP Expansion</text>

  <path d="M 150 110 L 150 133" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="40" y="135" width="220" height="40" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="150" y="159" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Instruction List Scheduling</text>

  <path d="M 150 175 L 150 198" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="40" y="200" width="220" height="40" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="150" y="224" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Register Allocation (Arch Regs)</text>

  <path d="M 150 240 L 150 263" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="40" y="265" width="220" height="40" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="150" y="289" font-family="sans-serif" font-size="12" fill="#0c4a6e" text-anchor="middle">Emitted Machine Assembly</text>

  <!-- Transition Arrow -->
  <path d="M 280 155 L 318 155" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Hardware Domain Box -->
  <rect x="320" y="20" width="260" height="310" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
  <text x="450" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">CPU Pipeline (Hardware)</text>

  <!-- Hardware Internal Steps -->
  <rect x="340" y="70" width="220" height="40" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  <text x="450" y="94" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Instruction Fetch &amp; Decode</text>

  <path d="M 450 110 L 450 133" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="340" y="135" width="220" height="40" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  <text x="450" y="159" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Register Rename &amp; ROB Alloc</text>

  <path d="M 450 175 L 450 198" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="340" y="200" width="220" height="40" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  <text x="450" y="224" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Out-of-Order Execution Window</text>

  <path d="M 450 240 L 450 263" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="340" y="265" width="220" height="40" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  <text x="450" y="289" font-family="sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Execution Units &amp; In-Order Retire</text>
</svg>
