<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Core 0 Block -->
  <rect x="30" y="30" width="230" height="130" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="6" />
  <text x="145" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Core 0 (Thread 0)</text>
  <rect x="45" y="70" width="200" height="30" fill="#ffffff" stroke="#0284c7" rx="4" />
  <text x="145" y="90" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Writes var_a (Offset 0x00)</text>
  <rect x="45" y="110" width="200" height="35" fill="#fee2e2" stroke="#dc2626" rx="4" />
  <text x="145" y="132" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">L1 Cache: INVALIDATED</text>

  <!-- Core 1 Block -->
  <rect x="340" y="30" width="230" height="130" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="6" />
  <text x="455" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Core 1 (Thread 1)</text>
  <rect x="355" y="70" width="200" height="30" fill="#ffffff" stroke="#0284c7" rx="4" />
  <text x="455" y="90" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Writes var_b (Offset 0x08)</text>
  <rect x="355" y="110" width="200" height="35" fill="#fef08a" stroke="#ca8a04" rx="4" />
  <text x="455" y="132" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">L1 Cache: MODIFIED (Acquiring)</text>

  <!-- Interconnect / Bus Block -->
  <rect x="30" y="210" width="540" height="45" fill="#cbd5e1" stroke="#475569" stroke-width="2" rx="6" />
  <text x="300" y="237" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Shared Interconnect / Hardware Coherence Bus</text>

  <!-- Single Cache Line Box -->
  <rect x="150" y="280" width="300" height="45" fill="#ffffff" stroke="#475569" stroke-dasharray="4" stroke-width="2" rx="4" />
  <text x="300" y="300" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Single 64-Byte Cache Line [0x1000]</text>
  <text x="300" y="318" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Contains var_a (0x00) and var_b (0x08)</text>

  <!-- Arrows -->
  <path d="M 145 160 L 145 210" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)" fill="none" />
  <path d="M 455 160 L 455 210" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <path d="M 300 255 L 300 280" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />

  <!-- Labels on arrows -->
  <text x="85" y="190" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Invalidation</text>
  <text x="510" y="190" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">Bus Request</text>
</svg>
