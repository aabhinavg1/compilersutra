<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="300" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Loop Strip Mining: Mapping Scalar Loop to Vector Hardware
  </text>

  <!-- Scalar Loop Stream -->
  <g transform="translate(40, 60)">
    <text x="0" y="15" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Original Loop Iterations (N = 10)</text>
    <rect x="0" y="25" width="520" height="30" fill="#e2e8f0" stroke="#cbd5e1" rx="4" />
    <!-- Iteration divides -->
    <path d="M 52,25 V 55 M 104,25 V 55 M 156,25 V 55 M 208,25 V 55 M 260,25 V 55 M 312,25 V 55 M 364,25 V 55 M 416,25 V 55 M 468,25 V 55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="26" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=0</text>
    <text x="78" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=1</text>
    <text x="130" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=2</text>
    <text x="182" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=3</text>
    <text x="234" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=4</text>
    <text x="286" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=5</text>
    <text x="338" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=6</text>
    <text x="390" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=7</text>
    <text x="442" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=8</text>
    <text x="494" y="44" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">i=9</text>
  </g>

  <!-- Connectors -->
  <path d="M 92,115 V 145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 300,115 V 145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 494,115 V 145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Transformed Vector Execution -->
  <g transform="translate(40, 155)">
    <!-- Stage 1: Alignment Peel / Prologue -->
    <rect x="0" y="0" width="104" height="70" fill="#fef3c7" stroke="#f59e0b" rx="6" />
    <text x="52" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Prologue Loop</text>
    <text x="52" y="40" font-family="sans-serif" font-size="11" fill="#78350f" text-anchor="middle">Scalar Peel</text>
    <text x="52" y="55" font-family="sans-serif" font-size="10" fill="#78350f" text-anchor="middle">Align to 32B</text>

    <!-- Stage 2: Main Vector Body -->
    <rect x="120" y="0" width="280" height="70" fill="#e0f2fe" stroke="#0284c7" rx="6" />
    <text x="260" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Vector Loop Body (VF = 4)</text>
    <!-- Vector Reg 1 -->
    <rect x="135" y="32" width="115" height="26" fill="#0284c7" rx="3" />
    <text x="192" y="49" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Vector Iter 1 [i=2..5]</text>
    <!-- Vector Reg 2 -->
    <rect x="270" y="32" width="115" height="26" fill="#0284c7" rx="3" />
    <text x="327" y="49" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Vector Iter 2 [i=6..9]</text>

    <!-- Stage 3: Scalar Epilogue -->
    <rect x="416" y="0" width="104" height="70" fill="#fee2e2" stroke="#ef4444" rx="6" />
    <text x="468" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Epilogue Loop</text>
    <text x="468" y="40" font-family="sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">Scalar Remainder</text>
    <text x="468" y="55" font-family="sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">N % VF elements</text>
  </g>

  <!-- Flow Arrows between stages -->
  <path d="M 144,190 H 155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 440,190 H 451" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Key Takeaway Box -->
  <g transform="translate(40, 255)">
    <rect width="520" height="70" fill="#ffffff" stroke="#cbd5e1" rx="6" />
    <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Execution Flow Highlights:</text>
    <text x="15" y="40" font-family="sans-serif" font-size="11" fill="#475569">1. Peel loop executes individual scalar steps until pointer matches SIMD bus alignment boundary.</text>
    <text x="15" y="56" font-family="sans-serif" font-size="11" fill="#475569">2. Vector main body processes full VF chunks; Epilogue clears leftover N % VF scalar iterations.</text>
  </g>
</svg>
