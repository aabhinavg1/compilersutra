<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title/Labels -->
  <text x="150" y="30" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Latency-Bound Chain (Low ILP)</text>
  <text x="450" y="30" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Independent Streams (High ILP)</text>

  <!-- Divider -->
  <line x1="300" y1="20" x2="300" y2="330" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4" />

  <!-- Left Side: Chain -->
  <!-- Inst A -->
  <rect x="80" y="60" width="140" height="40" fill="#0284c7" rx="4" />
  <text x="150" y="85" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i1: Load R1, [Addr]</text>

  <!-- Inst B -->
  <rect x="80" y="140" width="140" height="40" fill="#0284c7" rx="4" />
  <text x="150" y="165" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i2: Add R2, R1, 1</text>

  <!-- Inst C -->
  <rect x="80" y="220" width="140" height="40" fill="#0284c7" rx="4" />
  <text x="150" y="245" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i3: Mul R3, R2, 5</text>

  <!-- Arrows Left -->
  <line x1="150" y1="100" x2="150" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="185" y="125" fill="#e11d48" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RAW</text>

  <line x1="150" y1="180" x2="150" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="185" y="205" fill="#e11d48" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RAW</text>

  <text x="150" y="295" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">Critical Path Length = 3 Ops</text>
  <text x="150" y="315" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">Execution: Sequential</text>

  <!-- Right Side: Parallel -->
  <!-- Inst A1 -->
  <rect x="330" y="60" width="110" height="40" fill="#0284c7" rx="4" />
  <text x="385" y="85" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i1: Add R1, R2, R3</text>

  <!-- Inst A2 -->
  <rect x="460" y="60" width="110" height="40" fill="#0284c7" rx="4" />
  <text x="515" y="85" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i2: Add R4, R5, R6</text>

  <!-- Inst B1 -->
  <rect x="330" y="160" width="110" height="40" fill="#0284c7" rx="4" />
  <text x="385" y="185" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i3: Mul R7, R1, 2</text>

  <!-- Inst B2 -->
  <rect x="460" y="160" width="110" height="40" fill="#0284c7" rx="4" />
  <text x="515" y="185" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">i4: Mul R8, R4, 3</text>

  <!-- Arrows Right -->
  <line x1="385" y1="100" x2="385" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="515" y1="100" x2="515" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <text x="450" y="245" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">Critical Path Length = 2 Ops</text>
  <text x="450" y="265" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">Execution: 2-Wide Concurrent</text>
</svg>
