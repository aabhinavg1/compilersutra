<svg viewBox="0 0 600 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
    </marker>
  </defs>
  <rect x="50" y="50" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="80" font-size="14" text-anchor="middle">Instruction Issue</text>
  <line x1="250" y1="75" x2="350" y2="75" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="50" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="450" y="80" font-size="14" text-anchor="middle">Faulting Instruction</text>
  <line x1="550" y1="75" x2="600" y2="75" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="50" y="150" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="180" font-size="14" text-anchor="middle">Pipeline Flush</text>
  <line x1="250" y1="175" x2="350" y2="175" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="150" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="450" y="180" font-size="14" text-anchor="middle">State Rollback</text>
  <line x1="550" y1="175" x2="600" y2="175" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="50" y="250" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="280" font-size="14" text-anchor="middle">Exception Handler Entry</text>
  <line x1="250" y1="275" x2="350" y2="275" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="250" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="450" y="280" font-size="14" text-anchor="middle">Handler Stack Frame</text>
  <line x1="550" y1="275" x2="600" y2="275" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="50" y="350" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="380" font-size="14" text-anchor="middle">Exception Return</text>
  <line x1="250" y1="375" x2="350" y2="375" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="350" width="200" height="50" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="450" y="380" font-size="14" text-anchor="middle">Resume After Fault</text>
</svg>
