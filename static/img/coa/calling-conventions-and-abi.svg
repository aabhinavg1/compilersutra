<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orientation="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Stack Representation Outer Box -->
  <rect x="220" y="20" width="160" height="310" fill="#ffffff" stroke="#94a3b8" stroke-width="2" rx="4" />

  <!-- Stack Sections -->
  <!-- Parameter Area (Caller Frame) -->
  <rect x="225" y="25" width="150" height="40" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <text x="300" y="45" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="bold">Stack Arguments</text>
  <text x="300" y="58" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Caller Frame: Arg7...)</text>

  <!-- Return Address -->
  <rect x="225" y="68" width="150" height="30" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
  <text x="300" y="88" font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="bold">Return Address</text>

  <!-- Saved Frame Pointer -->
  <rect x="225" y="101" width="150" height="30" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
  <text x="300" y="120" font-family="sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="bold">Saved %rbp / Frame Pt</text>

  <!-- Saved Callee Registers -->
  <rect x="225" y="134" width="150" height="40" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
  <text x="300" y="154" font-family="sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="bold">Callee-Saved Regs</text>
  <text x="300" y="167" font-family="sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">(%r12, %r13, etc.)</text>

  <!-- Local Variables & Spills -->
  <rect x="225" y="177" width="150" height="50" fill="#0284c7" fill-opacity="0.10" stroke="#0284c7" stroke-width="1" />
  <text x="300" y="200" font-family="sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="bold">Local Stack Variables</text>
  <text x="300" y="215" font-family="sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">&amp; Register Spills</text>

  <!-- Red Zone -->
  <rect x="225" y="235" width="150" height="50" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1" />
  <text x="300" y="258" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">Red Zone (128B)</text>
  <text x="300" y="272" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Scratch space below %rsp)</text>

  <!-- Labels and Pointers -->
  <!-- Frame Pointer %rbp -->
  <path d="M 120 116 L 215 116" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="110" y="120" font-family="sans-serif" font-size="12" fill="#0284c7" font-weight="bold" text-anchor="end">%rbp (Base Pt)</text>

  <!-- Stack Pointer %rsp -->
  <path d="M 120 227 L 215 227" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="110" y="231" font-family="sans-serif" font-size="12" fill="#0284c7" font-weight="bold" text-anchor="end">%rsp (Stack Pt)</text>

  <!-- Register Passing Side Box -->
  <rect x="420" y="60" width="160" height="180" fill="#ffffff" stroke="#475569" stroke-width="1.5" rx="4" />
  <text x="500" y="82" font-family="sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Register Convention</text>
  
  <rect x="430" y="95" width="140" height="35" fill="#f1f5f9" stroke="#cbd5e1" rx="2" />
  <text x="500" y="110" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="bold">Caller-Saved (Scratch)</text>
  <text x="500" y="123" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">%rax, %rcx, %rdx, %rsi, %rdi, %r8-%r11</text>

  <rect x="430" y="140" width="140" height="35" fill="#e0f2fe" stroke="#bae6fd" rx="2" />
  <text x="500" y="155" font-family="sans-serif" font-size="10" fill="#0369a1" text-anchor="middle" font-weight="bold">Callee-Saved (Preserved)</text>
  <text x="500" y="168" font-family="sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">%rbx, %rsp, %rbp, %r12-%r15</text>

  <rect x="430" y="185" width="140" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="2" />
  <text x="500" y="200" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="bold">Arguments / Return</text>
  <text x="500" y="213" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Args: %rdi..%r9 | Ret: %rax</text>

</svg>
