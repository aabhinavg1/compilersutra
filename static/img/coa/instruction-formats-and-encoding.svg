<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
    Fixed-Width Instruction Constraints (32-bit RISC)
  </text>

  <!-- I-Type Format Block -->
  <g transform="translate(50, 60)">
    <rect width="500" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" rx="4" />
    <text x="250" y="-10" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">
      I-Type Format (e.g., addi)
    </text>
    
    <!-- Fields -->
    <rect x="0" width="150" height="40" fill="#0284c7" opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <text x="75" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1" font-weight="bold">Immediate [11:0] (12 bits)</text>

    <rect x="150" width="80" height="40" fill="#475569" opacity="0.2" stroke="#475569" stroke-width="1" />
    <text x="190" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">rs1 (5b)</text>

    <rect x="230" width="80" height="40" fill="#475569" opacity="0.2" stroke="#475569" stroke-width="1" />
    <text x="270" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">funct3 (3b)</text>

    <rect x="310" width="80" height="40" fill="#475569" opacity="0.2" stroke="#475569" stroke-width="1" />
    <text x="350" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">rd (5b)</text>

    <rect x="390" width="110" height="40" fill="#475569" opacity="0.2" stroke="#475569" stroke-width="1" />
    <text x="445" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">opcode (7b)</text>
  </g>

  <!-- U-Type Format Block -->
  <g transform="translate(50, 140)">
    <rect width="500" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" rx="4" />
    <text x="250" y="-10" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">
      U-Type Format (e.g., lui)
    </text>
    
    <!-- Fields -->
    <rect x="0" width="310" height="40" fill="#0284c7" opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <text x="155" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1" font-weight="bold">Immediate [31:12] (20 bits)</text>

    <rect x="310" width="80" height="40" fill="#475569" opacity="0.2" stroke="#475569" stroke-width="1" />
    <text x="350" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">rd (5b)</text>

    <rect x="390" width="110" height="40" fill="#475569" opacity="0.2" stroke="#475569" stroke-width="1" />
    <text x="445" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">opcode (7b)</text>
  </g>

  <!-- Synthesis Logic -->
  <g transform="translate(50, 220)">
    <rect width="500" height="100" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="4" />
    <text x="250" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
      Compiler Constant Synthesis (32-bit Target)
    </text>

    <!-- Step 1 -->
    <rect x="20" y="35" width="210" height="50" fill="#ffffff" stroke="#cbd5e1" rx="4" />
    <text x="125" y="53" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">lui a0, 0x12346</text>
    <text x="125" y="70" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Loads adjusted high 20 bits</text>

    <!-- Plus sign -->
    <text x="250" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#475569">+</text>

    <!-- Step 2 -->
    <rect x="270" y="35" width="210" height="50" fill="#ffffff" stroke="#cbd5e1" rx="4" />
    <text x="375" y="53" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">addi a0, a0, -256</text>
    <text x="375" y="70" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Adds sign-extended low 12 bits</text>
  </g>

  <!-- Connectors -->
  <path d="M 125, 180 L 125, 212" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)" />
  <path d="M 125, 100 L 375, 212" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)" />
</svg>
