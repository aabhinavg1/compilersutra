<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="640" height="220" fill="#f8fafc" rx="8"/>
  <text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Address generation, beside the ALU</text>
  <g font-family="sans-serif" font-size="12" fill="#0f172a">
    <rect x="24" y="56" width="110" height="44" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="79" y="82" text-anchor="middle">base</text>
    <rect x="154" y="56" width="110" height="44" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="209" y="82" text-anchor="middle">index × scale</text>
    <rect x="284" y="56" width="120" height="44" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="344" y="82" text-anchor="middle">displacement</text>
    <rect x="434" y="48" width="180" height="60" rx="4" fill="#bae6fd" stroke="#0369a1"/>
    <text x="524" y="74" text-anchor="middle" font-weight="bold">AGU</text>
    <text x="524" y="92" text-anchor="middle">effective address</text>
  </g>
  <g stroke="#475569" fill="none" stroke-width="1.5">
    <path d="M134 78 H154"/>
    <path d="M264 78 H284"/>
    <path d="M404 78 H434"/>
  </g>
  <text x="320" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">base + index × scale + displacement</text>
  <text x="320" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">The ALU can do other arithmetic in the same cycle. It does not form this address.</text>
</svg>
