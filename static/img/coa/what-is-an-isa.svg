<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  
  <!-- Software Domain -->
  <rect x="50" y="40" width="500" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="300" y="75" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">Software Layer (Compiler, ABI, Application)</text>
  <text x="300" y="100" font-family="sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">Generates instructions, manages registers, enforces memory ordering</text>
  
  <!-- ISA Contract Boundary -->
  <line x1="50" y1="175" x2="550" y2="175" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4" />
  <text x="300" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">Instruction Set Architecture (ISA) Contract</text>
  
  <!-- Hardware Domain -->
  <rect x="50" y="230" width="500" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
  <text x="300" y="265" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Hardware Layer (Microarchitecture, Pipeline)</text>
  <text x="300" y="290" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Executes instructions, renames registers, schedules out-of-order</text>
  
  <!-- Interaction Arrows -->
  <path d="M 200,120 L 200,228" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="140" y="150" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Target Instructions</text>
  
  <path d="M 400,230 L 400,122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="460" y="150" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Execution Guarantees</text>
</svg>
