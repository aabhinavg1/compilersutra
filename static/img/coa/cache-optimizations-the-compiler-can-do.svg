<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    Cache Line Access Patterns: Strided vs. Unit-Stride
  </text>

  <!-- BAD ACCESS PATTERN -->
  <g transform="translate(30, 60)">
    <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">
      Bad Access Pattern (Stride > Line Size)
    </text>
    
    <!-- Memory Line 0 -->
    <rect x="0" y="35" width="250" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="0" y="35" width="31.25" height="40" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5" />
    <text x="15.6" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">E0</text>
    <text x="140" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Cache Line 0 (64 Bytes Loaded)</text>

    <!-- Memory Line 1 -->
    <rect x="280" y="35" width="250" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="280" y="35" width="31.25" height="40" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5" />
    <text x="295.6" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">E1</text>
    <text x="420" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Cache Line 1 (64 Bytes Loaded)</text>

    <!-- Arrow between misses -->
    <path d="M 32 55 C 100 105, 200 105, 278 55" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="155" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626">Stride Jump (Waste 56B per Fetch)</text>
  </g>

  <!-- GOOD ACCESS PATTERN -->
  <g transform="translate(30, 200)">
    <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">
      Optimal Unit-Stride Access Pattern
    </text>
    
    <!-- Single Memory Line with sequential accesses -->
    <rect x="0" y="35" width="530" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    
    <!-- Elements E0 to E7 -->
    <rect x="0" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="33.1" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E0</text>

    <rect x="66.25" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="99.3" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E1</text>

    <rect x="132.5" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="165.6" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E2</text>

    <rect x="198.75" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="231.8" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E3</text>

    <rect x="265" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="298.1" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E4</text>

    <rect x="331.25" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="364.3" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E5</text>

    <rect x="397.5" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="430.6" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E6</text>

    <rect x="463.75" y="35" width="66.25" height="40" fill="#86efac" stroke="#16a34a" stroke-width="1" />
    <text x="496.8" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">E7</text>

    <!-- Path showing consecutive hits -->
    <path d="M 33 35 C 33 15, 99 15, 99 30" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 99 35 C 99 15, 165 15, 165 30" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="265" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">1 Cache Line Fetch = 8 Hits (100% Line Utilization)</text>
  </g>
</svg>
