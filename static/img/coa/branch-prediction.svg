<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Blocks -->
  <!-- Fetch Stage -->
  <rect x="30" y="140" width="100" height="60" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
  <text x="80" y="168" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Instruction</text>
  <text x="80" y="184" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Fetch</text>

  <!-- Branch Predictor -->
  <polygon points="200,170 250,130 300,170 250,210" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
  <text x="250" y="166" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Branch</text>
  <text x="250" y="178" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Predictor</text>

  <!-- Speculative Execution Stage -->
  <rect x="370" y="80" width="120" height="60" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
  <text x="430" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Speculative</text>
  <text x="430" y="124" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pipeline Execution</text>

  <!-- Execute & Resolve Stage -->
  <rect x="370" y="220" width="120" height="60" rx="6" fill="#475569" stroke="#1e293b" stroke-width="2" />
  <text x="430" y="248" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Branch Resolution</text>
  <text x="430" y="264" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">(Execute Stage)</text>

  <!-- Connectors -->
  <!-- Fetch to Predictor -->
  <line x1="130" y1="170" x2="190" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Predictor to Speculative Path (Predicted Taken / Not Taken) -->
  <path d="M 275 150 L 275 110 L 360 110" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead-blue)" />
  <text x="315" y="102" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fetch Target</text>

  <!-- Speculative to Execute -->
  <line x1="430" y1="140" x2="430" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Execute to Predictor State Update -->
  <path d="M 370 250 L 250 250 L 250 220" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowhead)" />
  <text x="310" y="242" fill="#475569" font-family="sans-serif" font-size="10" text-anchor="middle">Update History Table</text>

  <!-- Misprediction Flush Path -->
  <path d="M 490 250 L 540 250 L 540 30 L 80 30 L 80 130" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowhead-red)" />
  <text x="310" y="22" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Misprediction Flush &amp; Redirect Fetch</text>

</svg>
