<svg viewBox="0 0 600 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
    </marker>
  </defs>
  <!-- Assembler -->
  <rect x="50" y="30" width="120" height="80" fill="#0284c7" stroke="#475569" stroke-width="2"/>
  <text x="110" y="70" font-size="14" fill="#f8fafc" text-anchor="middle">Assembler</text>
  <!-- Linker -->
  <rect x="240" y="30" width="120" height="80" fill="#0284c7" stroke="#475569" stroke-width="2"/>
  <text x="300" y="70" font-size="14" fill="#f8fafc" text-anchor="middle">Linker</text>
  <!-- Loader -->
  <rect x="430" y="30" width="120" height="80" fill="#0284c7" stroke="#475569" stroke-width="2"/>
  <text x="490" y="70" font-size="14" fill="#f8fafc" text-anchor="middle">Loader</text>
  <!-- Arrows -->
  <line x1="170" y1="70" x2="240" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="70" x2="430" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="170" y="100" font-size="12" fill="#475569" text-anchor="middle">Object files</text>
  <text x="360" y="100" font-size="12" fill="#475569" text-anchor="middle">Executable image</text>
</svg>
