<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="300" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Hardware Pipeline Stall and Bubble Injection</text>

  <!-- Cycle Labels -->
  <text x="70" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Stage</text>
  <text x="160" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Cycle 1</text>
  <text x="270" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Cycle 2 (Stall)</text>
  <text x="380" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Cycle 3</text>
  <text x="490" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Cycle 4</text>

  <!-- Divider Line -->
  <line x1="20" y1="80" x2="580" y2="80" stroke="#cbd5e1" stroke-width="1" />

  <!-- Fetch Stage Row -->
  <text x="70" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">Fetch</text>
  <rect x="120" y="95" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="160" y="117" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 3</text>
  
  <rect x="230" y="95" width="80" height="35" fill="#e11d48" rx="4" stroke="#9f1239" stroke-width="2" />
  <text x="270" y="117" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Inst 3 (Freeze)</text>

  <rect x="340" y="95" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="380" y="117" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 4</text>

  <rect x="450" y="95" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="490" y="117" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 5</text>

  <!-- Decode Stage Row -->
  <text x="70" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">Decode</text>
  <rect x="120" y="155" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="160" y="177" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 2 (Add)</text>

  <rect x="230" y="155" width="80" height="35" fill="#e11d48" rx="4" stroke="#9f1239" stroke-width="2" />
  <text x="270" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Inst 2 (Freeze)</text>

  <rect x="340" y="155" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="380" y="177" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 3</text>

  <rect x="450" y="155" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="490" y="177" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 4</text>

  <!-- Execute Stage Row -->
  <text x="70" y="235" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">Execute</text>
  <rect x="120" y="215" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="160" y="237" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 1 (Load)</text>

  <!-- BUBBLE -->
  <rect x="230" y="215" width="80" height="35" fill="#94a3b8" rx="4" stroke="#475569" stroke-width="2" stroke-dasharray="4 2" />
  <text x="270" y="237" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">BUBBLE (NOP)</text>

  <rect x="340" y="215" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="380" y="237" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 2 (Add)</text>

  <rect x="450" y="215" width="80" height="35" fill="#0284c7" rx="4" />
  <text x="490" y="237" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Inst 3</text>

  <!-- Connectors showing propagation -->
  <line x1="160" y1="130" x2="160" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="160" y1="190" x2="160" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <line x1="270" y1="190" x2="270" y2="215" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrowhead)" />

  <line x1="270" y1="155" x2="380" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Explanatory Legend -->
  <rect x="80" y="280" width="440" height="50" fill="#ffffff" stroke="#cbd5e1" rx="4" />
  <rect x="100" y="295" width="16" height="16" fill="#e11d48" rx="2" />
  <text x="122" y="308" font-family="sans-serif" font-size="11" fill="#334155">Stalled/Frozen Stage</text>

  <rect x="250" y="295" width="16" height="16" fill="#94a3b8" rx="2" />
  <text x="272" y="308" font-family="sans-serif" font-size="11" fill="#334155">Injected Bubble Slot</text>

  <rect x="400" y="295" width="16" height="16" fill="#0284c7" rx="2" />
  <text x="422" y="308" font-family="sans-serif" font-size="11" fill="#334155">Normal Execution</text>
</svg>
